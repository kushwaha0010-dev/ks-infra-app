name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Generate Android Folder Safely
      run: |
        flutter create --org com.ksinfra --project-name ks_infra_interiors temp_project
        cp -r temp_project/android ./android
        rm -rf temp_project
        
        # Apply configurations
        sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/' android/app/build.gradle
        sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/' android/app/build.gradle
        sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.10"/' android/build.gradle || true

        # Apply Custom Logo if logo.png is uploaded
        if [ -f logo.png ]; then
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp logo.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp logo.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp logo.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp logo.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp logo.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        fi

    - name: Install dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: KS-Infra-Interiors-APK
        path: build/app/outputs/flutter-apk/app-release.apk
