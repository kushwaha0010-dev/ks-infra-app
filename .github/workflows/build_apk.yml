name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'

    - name: Clean Build Environment & Configure App
      run: |
        # 1. Save user code and logo
        cp lib/main.dart /tmp/main.dart
        [ -f logo.png ] && cp logo.png /tmp/logo.png || true

        # 2. Re-create fresh clean Flutter project
        rm -rf * .dart_tool .git*
        git init
        flutter create . --org com.ksinfra --project-name ks_infra_interiors

        # 3. Restore app code
        cp /tmp/main.dart lib/main.dart

        # 4. Set Android Target SDK 34 & Kotlin 1.9.10
        sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/' android/app/build.gradle || true
        sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/' android/app/build.gradle || true
        sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.10"/' android/build.gradle || true

        # 5. Apply Custom Logo to Phone Launcher Icon
        if [ -f /tmp/logo.png ]; then
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp /tmp/logo.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp /tmp/logo.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp /tmp/logo.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp /tmp/logo.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp /tmp/logo.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        fi

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: KS-Infra-Interiors-APK
        path: build/app/outputs/flutter-apk/app-release.apk
