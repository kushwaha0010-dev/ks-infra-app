name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'

    - name: Generate Android Setup & Custom Logo
      run: |
        rm -rf android
        flutter create . --platforms=android --org com.ksinfra --project-name ks_infra_interiors
        
        # Configure Target SDK 34 and Kotlin 1.9.10
        sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/' android/app/build.gradle || true
        sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/' android/app/build.gradle || true
        sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.10"/' android/build.gradle || true
        sed -i 's/kotlin-gradle-plugin:1\.[0-9]\+\.[0-9]\+/kotlin-gradle-plugin:1.9.10/' android/build.gradle || true

        # Apply Custom Logo to App Icon if logo.png exists
        if [ -f logo.png ]; then
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp logo.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp logo.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp logo.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp logo.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp logo.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        fi

    - name: Install dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: KS-Infra-Interiors-APK
        path: build/app/outputs/flutter-apk/app-release.apk
